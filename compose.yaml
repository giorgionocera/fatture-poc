name: demo-fatture
services:
  app:
    build: .
    image: demo-fatture
    init: true
    ports:
      # Di norma raggiungibile solo da questo computer. "./demo avvia --rete" la apre alla rete locale (ASCOLTO=0.0.0.0).
      - "${ASCOLTO:-127.0.0.1}:8002:8002"
    env_file:
      - path: .env              # CHIAVE_FRONTIERA=...
        required: false
    environment:
      PROFILO: ${PROFILO:-}     # facoltativa: forza un profilo di modello (frontiera, locale)
    extra_hosts:
      - "host.docker.internal:host-gateway"   # il modello locale gira sul portatile, fuori dal contenitore
    networks:
      default:
        aliases: [fatture]      # il nome con cui la trova il contenitore del video ("app" è un dominio che Chromium apre solo in https)
    volumes:
      - ./lavoro:/app/lavoro
      - ./registrazioni:/app/registrazioni
      - ./config.toml:/app/config.toml:ro
      - ./prompt_sistema.txt:/app/prompt_sistema.txt:ro
      - ./app:/app/app:ro
      - ./tests:/app/tests:ro
      - ./prove:/app/prove:ro
      - ./contesto:/app/contesto:ro

  # Solo per ./demo video: non parte con ./demo avvia.
  video:
    profiles: ["video"]
    build:
      context: .
      dockerfile: Dockerfile.video
    image: demo-fatture-video
    init: true
    environment:
      INDIRIZZO_APP: http://fatture:8002
      DOMANDA_VIDEO: ${DOMANDA_VIDEO:-}
    volumes:
      - ./app:/app/app:ro
      - ./contesto:/app/contesto:ro
      - ./video:/app/video
